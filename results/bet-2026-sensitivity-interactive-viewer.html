function ticks(min,max,n){if(!isFinite(min)||!isFinite(max)||min===max)return[isFinite(min)?min:0];const raw=(max-min)/Math.max(n,1);const pow=Math.pow(10,Math.floor(Math.log10(Math.abs(raw)||1)));const step=[1,2,5,10].map(x=>x*pow).find(x=>x>=raw)||10*pow;const start=Math.ceil(min/step)*step;const vals=[];for(let v=start;v<=max+step*0.5;v+=step)vals.push(v);return vals;}

function tableFmt(col,v){if(!isNumericValue(v))return v;const n=+v,name=String(col||'').toLowerCase();if(name==='max gradient')return n.toFixed(6);if(['active parameters','extraction fisheries','index fisheries','regions','seasons','tag release groups','non-positive eigenvalues','strictly negative eigenvalues','zero eigenvalues'].includes(name))return Math.round(n).toLocaleString();if(['objective','objective value','total objective'].includes(name)||['tag','length frequency','weight frequency','age','cpue','catch','penalty'].includes(name))return n.toLocaleString(undefined,{minimumFractionDigits:3,maximumFractionDigits:3});return fmt(n);}
function sortedTableRows(rows,col,numericCols,dir){if(!col)return rows.slice();const numeric=numericCols.has(col);return rows.slice().sort((a,b)=>{const av=a[col],bv=b[col];let cmp=0;if(numeric){const an=isNumericValue(av)?+av:NaN,bn=isNumericValue(bv)?+bv:NaN;if(isNaN(an)&&isNaN(bn))cmp=0;else if(isNaN(an))cmp=1;else if(isNaN(bn))cmp=-1;else cmp=an-bn;}else{cmp=String(av==null?'':av).localeCompare(String(bv==null?'':bv),undefined,{numeric:true,sensitivity:'base'});}return cmp*dir;});}
function linePath(rows,x,y){return rows.map((r,i)=>(i?'L':'M')+x(recordX(r)).toFixed(1)+','+y(+r.value).toFixed(1)).join(' ');}
function svgEl(name,attrs){const node=document.createElementNS('http://www.w3.org/2000/svg',name);Object.entries(attrs||{}).forEach(([k,v])=>node.setAttribute(k,v));return node;}
function labelPieces(label){const s=String(label||'');if(s==='SB/SB[F=0]')return[{t:'SB/SB'},{t:'F=0',shift:'sub'}];const idx=s.indexOf('10^3');if(idx>=0)return[{t:s.slice(0,idx)+'10'},{t:'3',shift:'super'},{t:s.slice(idx+4)}];return[{t:s}];}
function appendRichText(parent,x,y,label,attrs,rotate){const text=svgEl('text',Object.assign({x:x,y:y},attrs||{}));if(rotate)text.setAttribute('transform','rotate(-90 '+x+' '+y+')');labelPieces(label).forEach(p=>{const t=svgEl('tspan',{});if(p.shift==='super'){t.setAttribute('baseline-shift','super');t.setAttribute('font-size','70%');}else if(p.shift==='sub'){t.setAttribute('baseline-shift','sub');t.setAttribute('font-size','70%');}t.textContent=p.t;text.appendChild(t);});parent.appendChild(text);return text;}
function setChartMode(mode){if(mode==='table'){el.svg.classList.add('hidden');el.table.classList.remove('hidden');}else{el.table.classList.add('hidden');el.svg.classList.remove('hidden');el.table.innerHTML='';}}
function hasTableValue(v){if(v===null||v===undefined)return false;if(typeof v==='number')return isFinite(v);const s=String(v).trim().toLowerCase();return s!==''&&!['na','n/a','nan','null','undefined'].includes(s);}
function columnsFor(m,rows){let cols=asArray(m.columns).filter(Boolean);if(!cols.length){cols=[];rows.forEach(r=>Object.keys(r).forEach(k=>{if(!cols.includes(k))cols.push(k);}));}return cols.filter(c=>rows.some(r=>hasTableValue(r[c])));}
function isNumericValue(v){return v!==null&&v!==''&&isFinite(+v);}
let drawTimer=null;function scheduleDraw(){el.rows.textContent='Updating...';if(drawTimer!==null)clearTimeout(drawTimer);drawTimer=setTimeout(()=>{drawTimer=null;draw();},80);}
function renderControls(){const m=metric(),k=kind(m),isFit=k==='fit_panels',isTable=k==='table';if(isFit)syncFitModel(m);el.tabs.innerHTML='';metrics.forEach(tm=>{const b=document.createElement('button');b.type='button';b.className='tab'+(tm.key===state.metric?' active':'');b.textContent=tm.label;b.onclick=()=>{state.metric=tm.key;syncFitModel(tm);renderControls();scheduleDraw();};el.tabs.appendChild(b);});el.region.innerHTML='';(regions.length?regions:['All']).forEach(r=>{const o=document.createElement('option');o.value=r;o.textContent=r;el.region.appendChild(o);});el.region.value=state.region;el.region.onchange=()=>{state.region=el.region.value;scheduleDraw();};el.regionField.classList.toggle('hidden',isFit||isTable||regions.length<=1);el.fisheryField.classList.add('hidden');el.fitModel.innerHTML='';metricModels(m).forEach(label=>{const o=document.createElement('option');o.value=label;o.textContent=label;el.fitModel.appendChild(o);});el.fitModel.value=state.fitModel;el.fitModel.onchange=()=>{state.fitModel=el.fitModel.value;scheduleDraw();};el.fitModelField.classList.toggle('hidden',!isFit);el.modelLabel.classList.toggle('hidden',isFit||isTable);el.modelActions.classList.toggle('hidden',isFit||isTable);el.models.classList.toggle('hidden',isFit||isTable);el.models.innerHTML='';models.forEach(mm=>{const label=document.createElement('label');label.className='model';label.title=mm.label;label.innerHTML='<input type="checkbox" value="'+esc(mm.label)+'" '+(state.selected.has(mm.label)?'checked':'')+'><i class="swatch" style="background:'+esc(mm.color)+'"></i><span class="model-name" title="'+esc(mm.label)+'">'+esc(mm.label)+'</span>';label.querySelector('input').onchange=e=>{if(e.target.checked)state.selected.add(mm.label);else state.selected.delete(mm.label);scheduleDraw();};el.models.appendChild(label);});document.getElementById('selectAll').onclick=()=>{models.forEach(mm=>state.selected.add(mm.label));renderControls();scheduleDraw();};document.getElementById('selectNone').onclick=()=>{state.selected.clear();renderControls();scheduleDraw();};}
function drawTable(m,rows){setChartMode('table');hoverPoints=[];el.title.textContent=m.label;if(!rows.length){el.rows.textContent='0 rows';el.table.innerHTML='<div style="padding:18px;color:#6a7d8c;font-weight:800">No selected data for this view</div>';return;}const cols=columnsFor(m,rows);const numericCols=new Set(cols.filter(c=>rows.some(r=>isNumericValue(r[c]))));if(state.tableSort.metric!==m.key||!cols.includes(state.tableSort.col))state.tableSort={metric:m.key,col:'',dir:1};const sorted=sortedTableRows(rows,state.tableSort.col,numericCols,state.tableSort.dir);el.rows.textContent=rows.length.toLocaleString()+(cols.includes('Model')?' models':' rows');const head='<thead><tr>'+cols.map(c=>{const active=state.tableSort.col===c,mark=active?(state.tableSort.dir>0?'&#9650;':'&#9660;'):'';return '<th data-col="'+esc(c)+'" class="'+(numericCols.has(c)?'num':'')+'"><button type="button" class="sort-btn">'+esc(c)+'<span class="sort-mark">'+mark+'</span></button></th>';}).join('')+'</tr></thead>';const body='<tbody>'+sorted.map(r=>'<tr>'+cols.map(c=>{const v=r[c],num=numericCols.has(c),display=hasTableValue(v)?(num&&isNumericValue(v)?tableFmt(c,v):v):'-';return '<td class="'+(num?'num':'')+'">'+esc(display)+'</td>';}).join('')+'</tr>').join('')+'</tbody>';el.table.innerHTML='<table class="data-table">'+head+body+'</table>';el.table.querySelectorAll('th[data-col] .sort-btn').forEach(btn=>{btn.onclick=()=>{const col=btn.parentNode.getAttribute('data-col');if(state.tableSort.metric===m.key&&state.tableSort.col===col)state.tableSort.dir*=-1;else state.tableSort={metric:m.key,col:col,dir:1};drawTable(m,rows);};});}
function addEmpty(W,H){el.svg.appendChild(svgEl('text',{x:W/2,y:H/2,'text-anchor':'middle',class:'empty'})).textContent='No selected data for this view';}
function observedSummary(rows){const byX=new Map();rows.forEach(r=>{const xv=recordX(r);if(!byX.has(xv))byX.set(xv,[]);byX.get(xv).push(r);});return Array.from(byX.entries()).map(([xv,vals])=>{const hit=vals.find(r=>isFinite(+r.value));return hit?Object.assign({},hit,{x:xv,value:+hit.value}):null;}).filter(Boolean).sort((a,b)=>a.x-b.x);}
function drawFitPanels(m,records){setChartMode('chart');hoverPoints=[];const fisheries=groupByFishery(records);const W=980,cols=3,gap=18,panelW=(W-40-gap*(cols-1))/cols,panelH=198,rowGap=64,H=Math.max(560,58+Math.ceil(Math.max(fisheries.length,1)/cols)*(panelH+rowGap)+30);el.svg.setAttribute('viewBox','0 0 '+W+' '+H);while(el.svg.firstChild)el.svg.removeChild(el.svg.firstChild);el.title.textContent=m.label+(state.fitModel?' - '+state.fitModel:'');el.rows.textContent=fisheries.length.toLocaleString()+' fishery panels / '+records.length.toLocaleString()+' plotted values';if(!records.length){addEmpty(W,H);return;}const isCpue=m.key==='cpue_fit';fisheries.forEach(([fish,rows],i)=>{const col=i%cols,row=Math.floor(i/cols),ox=20+col*(panelW+gap),oy=34+row*(panelH+rowGap),mar={l:70,r:8,t:44,b:42},iw=panelW-mar.l-mar.r,ih=panelH-mar.t-mar.b;const xs=rows.map(recordX).filter(isFinite),ys=rows.map(r=>+r.value).filter(isFinite);let xmin=Math.min(...xs),xmax=Math.max(...xs),ymin=0,ymax=Math.max(...ys)*1.08;if(!isFinite(ymax)||ymax<=0)ymax=1;if(xmax===xmin)xmax=xmin+1;const x=v=>ox+mar.l+(v-xmin)/(xmax-xmin||1)*iw;const y=v=>oy+mar.t+ih-(v-ymin)/(ymax-ymin||1)*ih;const title=rows.find(r=>r.fishery_label)||{};el.svg.appendChild(svgEl('text',{x:ox+mar.l,y:oy+16,class:'facet-title'})).textContent=(title.fishery_label||fish);appendRichText(el.svg,ox+16,oy+mar.t+ih/2,m.y_label||'',{'text-anchor':'middle',class:'label'},true);ticks(xmin,xmax,isCpue?8:5).forEach(v=>{el.svg.appendChild(svgEl('line',{x1:x(v),x2:x(v),y1:oy+mar.t,y2:oy+mar.t+ih,class:'gridline'}));const tx=svgEl('text',{x:x(v),y:oy+panelH-20,'text-anchor':'middle',class:'tick'});tx.textContent=isCpue?String(Math.round(v)):fmt(v);el.svg.appendChild(tx);});appendRichText(el.svg,ox+mar.l+iw/2,oy+panelH-4,m.x_label||'',{'text-anchor':'middle',class:'label'},false);ticks(ymin,ymax,3).forEach(v=>{el.svg.appendChild(svgEl('line',{x1:ox+mar.l,x2:ox+panelW-mar.r,y1:y(v),y2:y(v),class:'gridline'}));const ty=svgEl('text',{x:ox+mar.l-7,y:y(v)+4,'text-anchor':'end',class:'tick'});ty.textContent=fmt(v);el.svg.appendChild(ty);});el.svg.appendChild(svgEl('line',{x1:ox+mar.l,x2:ox+panelW-mar.r,y1:oy+mar.t+ih,y2:oy+mar.t+ih,class:'axis'}));el.svg.appendChild(svgEl('line',{x1:ox+mar.l,x2:ox+mar.l,y1:oy+mar.t,y2:oy+mar.t+ih,class:'axis'}));const obs=rows.filter(r=>r.source==='Observed'),fit=rows.filter(r=>r.source!=='Observed').sort((a,b)=>recordX(a)-recordX(b));if(isCpue){obs.forEach(r=>{const cx=x(recordX(r)),cy=y(+r.value);el.svg.appendChild(svgEl('circle',{cx:cx,cy:cy,r:2.9,class:'point cpue-point'}));hoverPoints.push({x:cx,y:cy,row:r});});if(fit.length>1){const d=linePath(fit,x,y);el.svg.appendChild(svgEl('path',{d:d,class:'line fit-line-halo'}));el.svg.appendChild(svgEl('path',{d:d,stroke:'#d95f02',class:'line fit-line'}));}fit.forEach(r=>hoverPoints.push({x:x(recordX(r)),y:y(+r.value),row:r}));}else{const obsAgg=observedSummary(obs);const ux=Array.from(new Set(obsAgg.map(r=>r.x).concat(fit.map(recordX)))).sort((a,b)=>a-b);const step=ux.length>1?Math.min(...ux.slice(1).map((v,j)=>v-ux[j]).filter(v=>v>0)):1;const bw=Math.max(1,Math.min(18,Math.abs(x(xmin+step)-x(xmin))*0.78));obsAgg.forEach(r=>{const yy=y(+r.value),xx=x(r.x);el.svg.appendChild(svgEl('rect',{x:xx-bw/2,y:yy,width:bw,height:Math.max(0,oy+mar.t+ih-yy),class:'bar'}));hoverPoints.push({x:xx,y:yy,row:r});});if(fit.length>1)el.svg.appendChild(svgEl('path',{d:linePath(fit,x,y),stroke:modelColor(state.fitModel),class:'line'}));fit.forEach(r=>hoverPoints.push({x:x(recordX(r)),y:y(+r.value),row:r}));}});wireTooltip(m);}
function drawKeyQuantities(m,records){setChartMode('chart');hoverPoints=[];const W=980,H=650,cols=2,gapX=50,gapY=56,panelW=(W-70-gapX)/cols,panelH=258;el.svg.setAttribute('viewBox','0 0 '+W+' '+H);while(el.svg.firstChild)el.svg.removeChild(el.svg.firstChild);const showRegion=regions.length>1;el.title.textContent=m.label+(showRegion?' - '+(state.region||'All'):'');const modelCount=new Set(records.map(r=>r.model)).size;el.rows.textContent=modelCount.toLocaleString()+' models / '+records.length.toLocaleString()+' values';if(!records.length){addEmpty(W,H);return;}const metricOrder=[];records.forEach(r=>{if(r.metric_key&&!metricOrder.includes(r.metric_key))metricOrder.push(r.metric_key);});metricOrder.slice(0,4).forEach((mk,i)=>{const rows=records.filter(r=>r.metric_key===mk);if(!rows.length)return;const col=i%cols,row=Math.floor(i/cols),ox=24+col*(panelW+gapX),oy=26+row*(panelH+gapY),mar={l:82,r:14,t:46,b:52},iw=panelW-mar.l-mar.r,ih=panelH-mar.t-mar.b;const xs=rows.map(recordX).filter(isFinite),ys=rows.map(r=>+r.value).filter(isFinite);let xmin=Math.min(...xs),xmax=Math.max(...xs),ymin=Math.min(...ys),ymax=Math.max(...ys);if(mk==='depletion'){ymin=0;ymax=Math.max(1,ymax*1.04);}else{ymin=Math.min(0,ymin);ymax=ymax*1.08;if(ymax===ymin)ymax=ymin+1;}if(xmax===xmin)xmax=xmin+1;const x=v=>ox+mar.l+(v-xmin)/(xmax-xmin||1)*iw;const y=v=>oy+mar.t+ih-(v-ymin)/(ymax-ymin||1)*ih;const label=rows[0].metric_label||mk,unit=rows[0].y_label||'';el.svg.appendChild(svgEl('text',{x:ox+mar.l,y:oy+16,class:'facet-title'})).textContent=label;appendRichText(el.svg,ox+16,oy+mar.t+ih/2,unit,{'text-anchor':'middle',class:'label'},true);ticks(xmin,xmax,5).forEach(v=>{el.svg.appendChild(svgEl('line',{x1:x(v),x2:x(v),y1:oy+mar.t,y2:oy+mar.t+ih,class:'gridline'}));const tx=svgEl('text',{x:x(v),y:oy+panelH-22,'text-anchor':'middle',class:'tick'});tx.textContent=String(Math.round(v));el.svg.appendChild(tx);});appendRichText(el.svg,ox+mar.l+iw/2,oy+panelH-5,'Year',{'text-anchor':'middle',class:'label'},false);ticks(ymin,ymax,4).forEach(v=>{el.svg.appendChild(svgEl('line',{x1:ox+mar.l,x2:ox+panelW-mar.r,y1:y(v),y2:y(v),class:'gridline'}));const ty=svgEl('text',{x:ox+mar.l-9,y:y(v)+4,'text-anchor':'end',class:'tick'});ty.textContent=fmt(v);el.svg.appendChild(ty);});el.svg.appendChild(svgEl('line',{x1:ox+mar.l,x2:ox+panelW-mar.r,y1:oy+mar.t+ih,y2:oy+mar.t+ih,class:'axis'}));el.svg.appendChild(svgEl('line',{x1:ox+mar.l,x2:ox+mar.l,y1:oy+mar.t,y2:oy+mar.t+ih,class:'axis'}));if(mk==='depletion'){[{v:0.2,c:'#b73e3e'}].forEach(r=>{if(r.v>=ymin&&r.v<=ymax)el.svg.appendChild(svgEl('line',{x1:ox+mar.l,x2:ox+panelW-mar.r,y1:y(r.v),y2:y(r.v),stroke:r.c,class:'ref'}));});}groupByModel(rows).forEach((series,model)=>{el.svg.appendChild(svgEl('path',{d:linePath(series,x,y),stroke:modelColor(model),class:'line'}));series.forEach(r=>hoverPoints.push({x:x(recordX(r)),y:y(+r.value),row:r}));});});wireTooltip(m);}
function drawTimeSeries(m,records){setChartMode('chart');hoverPoints=[];const W=980,H=560,mar={l:76,r:24,t:20,b:58},iw=W-mar.l-mar.r,ih=H-mar.t-mar.b;el.svg.setAttribute('viewBox','0 0 '+W+' '+H);while(el.svg.firstChild)el.svg.removeChild(el.svg.firstChild);const showRegion=regions.length>1;el.title.textContent=m.label+(showRegion?' - '+(state.region||'All'):'');el.rows.textContent=records.length.toLocaleString()+' rows';if(!records.length){addEmpty(W,H);return;}const xs=records.map(recordX).filter(isFinite),ys=records.map(r=>+r.value).filter(isFinite);let xmin=Math.min(...xs),xmax=Math.max(...xs),ymin=Math.min(...ys),ymax=Math.max(...ys);if(m.key==='depletion'){ymin=0;ymax=Math.max(1,ymax*1.04);}else{ymin=Math.min(0,ymin);ymax=ymax*1.08;if(ymax===ymin)ymax=ymin+1;}if(xmax===xmin)xmax=xmin+1;const x=v=>mar.l+(v-xmin)/(xmax-xmin||1)*iw;const y=v=>mar.t+ih-(v-ymin)/(ymax-ymin||1)*ih;ticks(xmin,xmax,7).forEach(v=>{el.svg.appendChild(svgEl('line',{x1:x(v),x2:x(v),y1:mar.t,y2:mar.t+ih,class:'gridline'}));const tx=svgEl('text',{x:x(v),y:H-30,'text-anchor':'middle',class:'tick'});tx.textContent=String(Math.round(v));el.svg.appendChild(tx);});ticks(ymin,ymax,5).forEach(v=>{el.svg.appendChild(svgEl('line',{x1:mar.l,x2:W-mar.r,y1:y(v),y2:y(v),class:'gridline'}));const ty=svgEl('text',{x:mar.l-10,y:y(v)+4,'text-anchor':'end',class:'tick'});ty.textContent=fmt(v);el.svg.appendChild(ty);});el.svg.appendChild(svgEl('line',{x1:mar.l,x2:W-mar.r,y1:mar.t+ih,y2:mar.t+ih,class:'axis'}));el.svg.appendChild(svgEl('line',{x1:mar.l,x2:mar.l,y1:mar.t,y2:mar.t+ih,class:'axis'}));let xl=svgEl('text',{x:mar.l+iw/2,y:H-8,'text-anchor':'middle',class:'label'});xl.textContent=m.x_label||'Year';el.svg.appendChild(xl);let yl=svgEl('text',{x:16,y:mar.t+ih/2,transform:'rotate(-90 16 '+(mar.t+ih/2)+')','text-anchor':'middle',class:'label'});yl.textContent=m.y_label||'';el.svg.appendChild(yl);if(m.key==='depletion'){[{v:0.2,c:'#b73e3e'}].forEach(r=>{if(r.v>=ymin&&r.v<=ymax)el.svg.appendChild(svgEl('line',{x1:mar.l,x2:W-mar.r,y1:y(r.v),y2:y(r.v),stroke:r.c,class:'ref'}));});}groupByModel(records).forEach((rows,model)=>{el.svg.appendChild(svgEl('path',{d:linePath(rows,x,y),stroke:modelColor(model),class:'line'}));rows.forEach(r=>hoverPoints.push({x:x(recordX(r)),y:y(+r.value),row:r}));});wireTooltip(m);}
function wireTooltip(m){el.svg.onmousemove=e=>{const rect=el.svg.getBoundingClientRect();const vb=el.svg.viewBox.baseVal;const sx=vb.width/rect.width,sy=vb.height/rect.height;const px=(e.clientX-rect.left)*sx,py=(e.clientY-rect.top)*sy;let best=null,bd=Infinity;hoverPoints.forEach(p=>{const dx=p.x-px,dy=p.y-py,d=dx*dx+dy*dy;if(d<bd){bd=d;best=p.row;}});if(best&&bd<1600){const src=best.source&&best.source!=='Value'?'<br>'+esc(best.source):'';const fish=best.fishery_label?'<br>'+esc(best.fishery_label):'';const metricName=best.metric_label?'<br>'+esc(best.metric_label):'';const model=best.model||best.Model||state.fitModel;const xLabel=best.x_label||m.x_label||'Year';el.tip.innerHTML='<strong>'+esc(model)+'</strong>'+metricName+src+fish+'<br>'+esc(xLabel)+' '+fmt(recordX(best))+': '+fmt(best.value);el.tip.style.left=e.clientX+'px';el.tip.style.top=e.clientY+'px';el.tip.style.opacity=1;}else{el.tip.style.opacity=0;}};el.svg.onmouseleave=()=>{el.tip.style.opacity=0;};}
function draw(){const m=metric();current=activeRecords();if(kind(m)==='table')drawTable(m,current);else if(kind(m)==='fit_panels')drawFitPanels(m,current);else if(kind(m)==='key_quantities')drawKeyQuantities(m,current);else drawTimeSeries(m,current);}
function render(){renderControls();draw();}
render();
})();
