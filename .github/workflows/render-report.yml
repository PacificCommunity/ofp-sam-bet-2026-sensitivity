name: Render BET 2026 sensitivity report

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "data/**"
      - "models/**"
      - "report/**"
      - "tests/**"
      - "run-report"
      - ".github/workflows/render-report.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sensitivity-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    container:
      image: ghcr.io/pacificcommunity/tuna-flow-private:v2.7@sha256:4fee4c40cb6439ff920b1dd233a84bf19d5cc0e37278c99ceff3fd79cb9c8852
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify TunaFlow 2.7 report runtime
        run: Rscript -e 'required <- c("ggplot2", "patchwork", "jsonlite", "ragg", "scales"); stopifnot(all(vapply(required, requireNamespace, logical(1), quietly = TRUE)))'

      - name: Validate and render without an MFCL refit
        run: ./run-report

      - name: Verify browser-ready report, viewer and PNGs
        shell: bash
        run: |
          test -s results/bet-2026-sensitivity-report.html
          test -s results/bet-2026-sensitivity-interactive-viewer.html
          test -s results/report-manifest.csv
          test "$(find results/figures -maxdepth 1 -name '*.png' -type f | wc -l)" -ge 8
          grep -q 'data:image/png;base64,' results/bet-2026-sensitivity-report.html
          grep -q 'pacificcommunity.github.io/ofp-sam-bet-2026-sensitivity/bet-2026-sensitivity-interactive-viewer.html' results/bet-2026-sensitivity-report.html
          ! grep -q 'releases/latest/download/bet-2026-sensitivity-interactive-viewer.html' results/bet-2026-sensitivity-report.html

      - name: Prepare GitHub Pages root
        if: github.ref == 'refs/heads/main'
        run: install -m 0644 results/bet-2026-sensitivity-interactive-viewer.html results/index.html

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: bet-2026-sensitivity-report
          path: results/
          if-no-files-found: error
          retention-days: 30

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: results

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: render
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: render
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bet-2026-sensitivity-report
          path: release/report
      - name: Build report bundle
        run: (cd release/report && zip -q -r ../bet-2026-sensitivity-report-${{ github.ref_name }}.zip .)
      - name: Publish report release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/report/bet-2026-sensitivity-interactive-viewer.html
            release/report/bet-2026-sensitivity-report.html
            release/report/report-manifest.csv
            release/bet-2026-sensitivity-report-${{ github.ref_name }}.zip
