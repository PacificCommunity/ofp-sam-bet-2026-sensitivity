name: Render BET 2026 sensitivity report

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install public report dependencies
        run: Rscript -e 'install.packages(c("ggplot2", "patchwork", "jsonlite", "ragg", "scales"))'

      - name: Validate and render without an MFCL refit
        run: ./run-report

      - name: Upload report artifact
        uses: actions/upload-artifact@v6
        with:
          name: bet-2026-sensitivity-report
          path: results/
          if-no-files-found: error
