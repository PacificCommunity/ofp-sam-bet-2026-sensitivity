name: Render BET 2026 sensitivity report

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install public report dependencies
        run: Rscript -e 'install.packages(c("ggplot2", "patchwork", "jsonlite", "ragg", "scales"))'

      - name: Validate and render without an MFCL refit
        run: ./run-report

      - name: Upload report artifact
        uses: actions/upload-artifact@v6
        with:
          name: bet-2026-sensitivity-report
          path: results/
          if-no-files-found: error

      - name: Upload interactive viewer to the GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          gh release upload "$RELEASE_TAG"
          results/bet-2026-sensitivity-interactive-viewer.html
          --clobber
