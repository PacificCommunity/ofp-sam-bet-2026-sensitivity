name: Verify preserved BET results

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Check saved Hessian restoration
        shell: bash
        run: |
          make hessian-verify
          Rscript reproduce/test_saved_archives.R
          python3 -m unittest discover -s reproduce -p 'test_hessian*.py' -v
          Rscript -e 'source("reproduce/hessian.R"); d <- read_manifest_h(normalizePath("reproduce/hessians.json")); for (k in sort(names(d$cases))) { x <- d$cases[[k]]; cat(k, if (is.null(x$kind)) "matrix" else x$kind, x$archive$url, x$archive$bytes, sep="\t"); cat("\n") }' > "$RUNNER_TEMP/bet-hessian-cases.tsv"
          mkdir -p "$RUNNER_TEMP/bet-hessian-cases" "$RUNNER_TEMP/bet-hessian-cli-logs" "$RUNNER_TEMP/bet-hessian-restored"
          failed=0
          while IFS=$'\t' read -r case kind url bytes; do
            echo "::group::Saved Hessian $case"
            archive="$RUNNER_TEMP/bet-hessian-$case.tar.gz"
            if Rscript -e 'source("reproduce/hessian.R"); x <- commandArgs(TRUE); download_h(x[1L], x[2L], as.numeric(x[3L]))' "$url" "$archive" "$bytes" &&
               make hessian CASE="$case" OUT="$RUNNER_TEMP/bet-hessian-restored/$case" ARCHIVE="$archive" > "$RUNNER_TEMP/bet-hessian-cli-logs/$case-restore.log" 2>&1; then
              echo "Restored exact original files for $case with R"
              if [ "$kind" = native_parts ]; then
                if ! make hessian-stitch CASE="$case" OUT="$RUNNER_TEMP/bet-hessian-cases/$case" ARCHIVE="$archive" > "$RUNNER_TEMP/bet-hessian-cli-logs/$case.log" 2>&1; then
                  tail -n 80 "$RUNNER_TEMP/bet-hessian-cli-logs/$case.log"
                  failed=1
                fi
              fi
            else
              tail -n 80 "$RUNNER_TEMP/bet-hessian-cli-logs/$case-restore.log" 2>/dev/null || true
              failed=1
            fi
            rm -f "$archive"
            echo "::endgroup::"
          done < "$RUNNER_TEMP/bet-hessian-cases.tsv"
          test "$failed" -eq 0
      - name: Check Make entry points without executing models
        run: python3 ci/check-make-entrypoints.py
      - name: Verify preserved assessment files
        run: python3 ci/verify-preserved-files.py
      - name: Check preserved inputs and results
        shell: bash
        run: |
          sha256sum -c data/SHA256SUMS
          Rscript report/validate.R
          python3 ci/run-in-scratch.py Rscript scripts/validate-sensitivities.R
          python3 ci/verify-preserved-files.py
          git diff --exit-code
      - name: Collect Hessian checks and short logs
        if: always()
        shell: bash
        run: |
          receipt_dir="$RUNNER_TEMP/bet-hessian-receipts"
          mkdir -p "$receipt_dir"
          shopt -s nullglob
          for result_dir in "$RUNNER_TEMP"/bet-hessian-cases/*; do
            [ -d "$result_dir" ] || continue
            case_id="$(basename "$result_dir")"
            if [ -f "$result_dir/stitch.json" ]; then
              cp "$result_dir/stitch.json" "$receipt_dir/$case_id-stitch.json"
            fi
            if [ -f "$result_dir/stitched/mfcl_stitch_log.txt" ]; then
              tail -c 65536 "$result_dir/stitched/mfcl_stitch_log.txt" > "$receipt_dir/$case_id-mfcl.log"
            fi
          done
          for log in "$RUNNER_TEMP"/bet-hessian-cli-logs/*.log; do
            tail -c 65536 "$log" > "$receipt_dir/$(basename "$log")"
          done
      - name: Retain Hessian checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saved-sensitivity-hessian-checks
          path: ${{ runner.temp }}/bet-hessian-receipts/*
          if-no-files-found: warn
          retention-days: 14

  native:
    name: Regenerate saved sensitivity fits (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Verify preserved source and native archive
        run: |
          python3 ci/verify-preserved-files.py
          python3 reproduce/restore.py --verify
      - name: Evaluate every saved PAR from the standalone kit
        shell: bash
        run: |
          unzip -q reproduce/standalone.zip -d "$RUNNER_TEMP/reader-kit"
          kit="$RUNNER_TEMP/reader-kit/bet-2026-sensitivity-standalone"
          make --no-print-directory -C "$kit" verify
          Rscript -e 'x <- read.csv(commandArgs(TRUE)[1])$model; stopifnot(length(x) == 17L, !anyDuplicated(x)); cat(x[(seq_along(x)-1L) %% 3L == as.integer(commandArgs(TRUE)[2])], sep="\n")' "$kit/models.csv" "${{ matrix.shard }}" > "$RUNNER_TEMP/native-cases.txt"
          mkdir "$RUNNER_TEMP/bet-native"
          while IFS= read -r case; do
            make --no-print-directory -C "$kit" rerun CASE="$case" OUT="$RUNNER_TEMP/bet-native/$case"
          done < "$RUNNER_TEMP/native-cases.txt"
      - name: Confirm source files are unchanged
        run: |
          python3 ci/verify-preserved-files.py
          git diff --exit-code
      - name: Retain numerical verification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saved-sensitivity-native-checks-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/bet-native/*/evaluation-check.csv
            ${{ runner.temp }}/bet-native/*/central-results.csv
            ${{ runner.temp }}/bet-native/*/mfcl-native.log
          if-no-files-found: error
          retention-days: 14

  native-logs:
    name: Verify original native MFCL logs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Check log archive safety without executing models
        run: python3 -m unittest discover -s reproduce -p 'test_native_logs.py' -v
      - name: Download and restore the original derivative traces
        shell: bash
        run: |
          make hessian-logs-verify
          make hessian-logs OUT="$RUNNER_TEMP/bet-native-mfcl-logs"
          git diff --exit-code
