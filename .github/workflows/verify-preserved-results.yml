name: Verify preserved BET results

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Verify preserved assessment files
        run: python3 ci/verify-preserved-files.py
      - name: Check preserved inputs and results
        shell: bash
        run: |
          sha256sum -c data/SHA256SUMS
          Rscript report/validate.R
          python3 ci/run-in-scratch.py Rscript scripts/validate-sensitivities.R
          python3 ci/verify-preserved-files.py
          git diff --exit-code

  native:
    name: Regenerate saved sensitivity fits
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify preserved source and native archive
        run: |
          python3 ci/verify-preserved-files.py
          python3 reproduce/restore.py --verify
      - name: Regenerate native outputs and compare original results
        run: python3 reproduce/run-native.py all "$RUNNER_TEMP/bet-native"
      - name: Confirm source files are unchanged
        run: |
          python3 ci/verify-preserved-files.py
          git diff --exit-code
      - name: Retain numerical verification receipts
        uses: actions/upload-artifact@v4
        with:
          name: saved-sensitivity-native-checks
          path: |
            ${{ runner.temp }}/bet-native/native-checks.json
            ${{ runner.temp }}/bet-native/*/native-check.json
          if-no-files-found: error
          retention-days: 14
