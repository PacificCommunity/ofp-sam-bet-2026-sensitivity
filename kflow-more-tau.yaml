name: BET-2026-sensitivity-more-tau
description: Run 8 independent BET 2026 fixed-tau sensitivities (tau=4,8,...,32) from ordinary Diagnostic makepar initial values, with no fitted checkpoint, seed, or sequential dependency.
command: bash run.sh
