name: BET-2026-sensitivity-report
description: Render the public BET 2026 one-at-a-time sensitivity report with completed fit and native-Hessian diagnostics; no model or Hessian rerun.
command: ./run-report
docker_image: ghcr.io/pacificcommunity/tuna-flow:v2.5@sha256:c87f1f6d9d4f62dc447844b58afe35f96af175bf933cb6cffbbbe39a59172360

# This report is submitted through the Kflow Local submitter. No remote host or
# pool requirement is specified here, so the scientific model fits are not rerun.
resources:
  cpus: 2
  memory: 8GB
  disk: 10GB

env:
  JOB_TITLE: BET 2026 sensitivity report | 17 fits | eight axes | Hessian diagnostics
  JOB_DESCRIPTION: Public report from 17 completed one-at-a-time sensitivities; renders four annual derived quantities and completed fit/Hessian diagnostics from checksum-locked payloads, with no MFCL or Hessian rerun.
  JOB_KEY: sensitivity-report-17-fits-hessian
  FLOW_GROUP: BET-2026-sensitivity-report
  FLOW_SPECIES: BET
  FLOW_SPECIES_LABEL: bigeye tuna
  FLOW_ASSESSMENT_YEAR: "2026"
  REPORT_OUTPUT_DIR: results
  KFLOW_RUNTIME_UPDATE: never
  TUNA_FLOW_RUNTIME_UPDATE: never
  KFLOW_RUNTIME_PACKAGES: none

tags:
  stage: sensitivity-report
  species: BET
  assessment_year: "2026"
  execution: local
  model_refit: "false"

output_patterns:
  - results/**
